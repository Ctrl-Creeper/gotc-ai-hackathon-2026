name: Pull request checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
      - name: Set up Python for static-site checks
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check platform.js
      - name: Run browser-side tests
        run: node --test tests/platform.test.mjs
      - name: Validate public site references
        run: python -B scripts/check_site.py

  backend:
    name: Backend checks (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run API tests
        run: python -B -m unittest discover -s server -p 'test_*.py' -v
      - name: Compile Python sources
        run: python -B -m py_compile server/app.py server/test_api.py server/test_shared_login.py scripts/check_site.py deploy/deploy.py deploy/install.py
